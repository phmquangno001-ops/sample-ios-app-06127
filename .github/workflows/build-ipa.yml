name: Build & Auto-Sign iOS IPA (AI Self-Healing Pipeline)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  CERT_PASSWORD: "1"
  TARGET_BUNDLE_ID: "com.three.autoipa"
  CERT_TEAM_ID: "8X992TEAMZ"

jobs:
  build-ipa:
    name: Build & Package Signed iOS IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Stable Xcode & Fix Simulator SDK Conflict
        shell: bash
        run: |
          set -e
          echo "=== Configuring Xcode Environment ==="
          xcodebuild -version
          sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer || true

      - name: Decode Base64 Certificate (certificate 2) & Import Keychain (Password 1)
        shell: bash
        run: |
          set -e
          echo "=== Step 1: Reading Certificate Base64 (cert.p12 & cert.mobileprovision) ==="
          mkdir -p "$RUNNER_TEMP/certs"

          if [ -f ".github/certs/cert.p12.b64" ]; then
            tr -d '\n\r ' < ".github/certs/cert.p12.b64" | base64 --decode > "$RUNNER_TEMP/certs/cert.p12"
            echo "Loaded cert.p12 from .github/certs/cert.p12.b64 ($(wc -c < "$RUNNER_TEMP/certs/cert.p12") bytes)"
          fi

          if [ -f ".github/certs/cert.mobileprovision.b64" ]; then
            tr -d '\n\r ' < ".github/certs/cert.mobileprovision.b64" | base64 --decode > "$RUNNER_TEMP/certs/cert.mobileprovision"
            echo "Loaded cert.mobileprovision from .github/certs/cert.mobileprovision.b64 ($(wc -c < "$RUNNER_TEMP/certs/cert.mobileprovision") bytes)"
          fi

          if [ -f ".github/certs/password.txt" ]; then
            CERT_PASS=$(cat ".github/certs/password.txt" | tr -d '\n\r')
          else
            CERT_PASS="$CERT_PASSWORD"
          fi
          [ -z "$CERT_PASS" ] && CERT_PASS="1"
          echo "Using Certificate Password: $CERT_PASS"

          # Create & unlock dedicated build keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="1"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH" || true
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          # Import cert.p12 with password 1
          if [ -s "$RUNNER_TEMP/certs/cert.p12" ]; then
            echo "Importing cert.p12 into Keychain..."
            security import "$RUNNER_TEMP/certs/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASS" -T /usr/bin/codesign -T /usr/bin/security -A || \
            openssl pkcs12 -in "$RUNNER_TEMP/certs/cert.p12" -passin "pass:$CERT_PASS" -nodes -out "$RUNNER_TEMP/certs/extracted.pem" 2>/dev/null && \
            openssl pkcs12 -export -legacy -in "$RUNNER_TEMP/certs/extracted.pem" -passout "pass:$CERT_PASS" -out "$RUNNER_TEMP/certs/cert_legacy.p12" 2>/dev/null && \
            security import "$RUNNER_TEMP/certs/cert_legacy.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASS" -T /usr/bin/codesign -T /usr/bin/security -A || true
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH" || true
          fi

          echo "=== Available Code Signing Identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

          # Parse cert.mobileprovision XML plist
          if [ -s "$RUNNER_TEMP/certs/cert.mobileprovision" ]; then
            security cms -D -i "$RUNNER_TEMP/certs/cert.mobileprovision" > "$RUNNER_TEMP/certs/profile.plist" 2>/dev/null || \
            openssl smime -inform DER -verify -noverify -in "$RUNNER_TEMP/certs/cert.mobileprovision" -out "$RUNNER_TEMP/certs/profile.plist" 2>/dev/null || \
            awk '/<\?xml/,/<\/plist>/' "$RUNNER_TEMP/certs/cert.mobileprovision" > "$RUNNER_TEMP/certs/profile.plist" || true

            if [ -s "$RUNNER_TEMP/certs/profile.plist" ]; then
              PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/certs/profile.plist" 2>/dev/null || echo "default-uuid")
              PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/certs/profile.plist" 2>/dev/null || echo "certificate 2")
              APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/certs/profile.plist" 2>/dev/null || echo "")
              TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/certs/profile.plist" 2>/dev/null || echo "$CERT_TEAM_ID")
              /usr/libexec/PlistBuddy -x -c "Print :Entitlements" "$RUNNER_TEMP/certs/profile.plist" > "$RUNNER_TEMP/certs/entitlements.plist" 2>/dev/null || true

              if [ -n "$APP_ID" ]; then
                EXTRACTED_BUNDLE_ID="${APP_ID#${TEAM_ID}.}"
                echo "Extracted Certificate Profile: $PROFILE_NAME | UUID: $PROFILE_UUID | Team: $TEAM_ID | Bundle ID: $EXTRACTED_BUNDLE_ID"
                if [[ "$EXTRACTED_BUNDLE_ID" != *"*"* ]] && [ -n "$EXTRACTED_BUNDLE_ID" ]; then
                  echo "RESOLVED_BUNDLE_ID=$EXTRACTED_BUNDLE_ID" >> "$GITHUB_ENV"
                fi
              fi

              mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
              mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
              cp "$RUNNER_TEMP/certs/cert.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
              cp "$RUNNER_TEMP/certs/cert.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
            fi
          fi

      - name: Auto-Detect Nested Project & Patch Exit Code 65 Issues
        shell: bash
        run: |
          set -e
          echo "=== Step 2: Scanning Repository for Xcode Project / Workspace ==="
          FINAL_BUNDLE_ID="${RESOLVED_BUNDLE_ID:-$TARGET_BUNDLE_ID}"
          echo "Target Bundle Identifier for Sync: $FINAL_BUNDLE_ID"

          # Find .xcworkspace or .xcodeproj even if nested inside a subfolder (e.g. 3105-main/Three...)
          WORKSPACE_PATH=$(find . -maxdepth 4 -name "*.xcworkspace" -not -path "*/Pods/*" -not -path "*.xcodeproj/*" -not -path "*/.git/*" | head -n 1)
          PROJECT_PATH=$(find . -maxdepth 4 -name "*.xcodeproj" -not -path "*/Pods/*" -not -path "*/.git/*" | head -n 1)

          if [ -z "$PROJECT_PATH" ] && [ -z "$WORKSPACE_PATH" ]; then
            echo "No .xcodeproj found in repository! Generating fallback iOS Xcode wrapper project..."
            mkdir -p AutoIPAApp/AutoIPAApp.xcodeproj
            cat << 'EOF_INFO' > AutoIPAApp/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>AutoIPAApp</string>
            <key>CFBundleIdentifier</key><string>${FINAL_BUNDLE_ID}</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>AutoIPAApp</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UILaunchScreen</key><dict/>
          </dict>
          </plist>
          EOF_INFO
          fi

          # Patch all project.pbxproj files to eliminate Exit Code 65 causes:
          # 1. Disable User Script Sandboxing (Xcode 15/16 Exit Code 65 culprit)
          # 2. Upgrade ancient IPHONEOS_DEPLOYMENT_TARGET (8.0/9.0/10.0/11.0 -> 13.0)
          # 3. Sync PRODUCT_BUNDLE_IDENTIFIER to match Certificate Bundle ID
          find . -maxdepth 5 -name "project.pbxproj" -not -path "*/Pods/*" | while read -r PBX; do
            echo "Patching $PBX to prevent Exit Code 65..."
            perl -pi -e 's/ENABLE_USER_SCRIPT_SANDBOXING = YES;/ENABLE_USER_SCRIPT_SANDBOXING = NO;/g' "$PBX"
            perl -pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = [89]\.0;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' "$PBX"
            perl -pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = 1[01]\.0;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' "$PBX"
            perl -pi -e 's/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g' "$PBX"
            perl -pi -e 's/PROVISIONING_PROFILE_SPECIFIER = "[^"]*";/PROVISIONING_PROFILE_SPECIFIER = "";/g' "$PBX"
            perl -pi -e "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = \"$FINAL_BUNDLE_ID\";/g" "$PBX"
          done

          # Check if Podfile exists and install CocoaPods if needed
          PODFILE_PATH=$(find . -maxdepth 4 -name "Podfile" -not -path "*/Pods/*" | head -n 1)
          if [ -n "$PODFILE_PATH" ]; then
            POD_DIR=$(dirname "$PODFILE_PATH")
            echo "Found Podfile in $POD_DIR. Running pod install..."
            pushd "$POD_DIR"
            pod install || pod install --repo-update || true
            if [ -f "Pods/Pods.xcodeproj/project.pbxproj" ]; then
              perl -pi -e 's/ENABLE_USER_SCRIPT_SANDBOXING = YES;/ENABLE_USER_SCRIPT_SANDBOXING = NO;/g' "Pods/Pods.xcodeproj/project.pbxproj"
            fi
            popd
          fi

      - name: Compile iOS App & Sign IPA with Certificate
        shell: bash
        run: |
          set -e
          echo "=== Step 3: Building iOS Application (Physical Device SDK iphoneos) ==="
          FINAL_BUNDLE_ID="${RESOLVED_BUNDLE_ID:-$TARGET_BUNDLE_ID}"
          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          mkdir -p "$DERIVED_DATA"
          mkdir -p "$GITHUB_WORKSPACE/output"

          WORKSPACE_PATH=$(find . -maxdepth 4 -name "*.xcworkspace" -not -path "*/Pods/*" -not -path "*.xcodeproj/*" -not -path "*/.git/*" | head -n 1)
          PROJECT_PATH=$(find . -maxdepth 4 -name "*.xcodeproj" -not -path "*/Pods/*" -not -path "*/.git/*" | head -n 1)

          BUILD_FLAGS=(
            -sdk iphoneos
            -destination "generic/platform=iOS"
            -derivedDataPath "$DERIVED_DATA"
            CODE_SIGN_IDENTITY=""
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGNING_ALLOWED=NO
            AD_HOC_CODE_SIGNING_ALLOWED=YES
            ENABLE_USER_SCRIPT_SANDBOXING=NO
            COMPILER_INDEX_STORE_ENABLE=NO
            ONLY_ACTIVE_ARCH=NO
            ARCHS="arm64"
            VALID_ARCHS="arm64"
          )

          if [ -n "$WORKSPACE_PATH" ]; then
            WORK_DIR=$(dirname "$WORKSPACE_PATH")
            WS_NAME=$(basename "$WORKSPACE_PATH")
            echo "Building Workspace: $WS_NAME in directory: $WORK_DIR"
            pushd "$WORK_DIR"
            SCHEME=$(xcodebuild -workspace "$WS_NAME" -list -json 2>/dev/null | python3 -c "import sys, json; d=json.load(sys.stdin); s=[x for x in d.get('workspace',{}).get('schemes',[]) if not x.startswith('Pods-')]; print(s[0] if s else '')" || echo "")
            echo "Detected Scheme: $SCHEME"
            xcodebuild -workspace "$WS_NAME" -scheme "$SCHEME" -configuration Release "${BUILD_FLAGS[@]}" build || \
            xcodebuild -workspace "$WS_NAME" -scheme "$SCHEME" -configuration Debug "${BUILD_FLAGS[@]}" build
            popd
          elif [ -n "$PROJECT_PATH" ]; then
            WORK_DIR=$(dirname "$PROJECT_PATH")
            PROJ_NAME=$(basename "$PROJECT_PATH")
            echo "Building Project: $PROJ_NAME in directory: $WORK_DIR"
            pushd "$WORK_DIR"
            SCHEME=$(xcodebuild -project "$PROJ_NAME" -list -json 2>/dev/null | python3 -c "import sys, json; d=json.load(sys.stdin); s=d.get('project',{}).get('schemes',[]); print(s[0] if s else '')" || echo "")
            TARGET=$(xcodebuild -project "$PROJ_NAME" -list -json 2>/dev/null | python3 -c "import sys, json; d=json.load(sys.stdin); t=d.get('project',{}).get('targets',[]); print(t[0] if t else '')" || echo "")
            echo "Detected Scheme: $SCHEME | Target: $TARGET"
            if [ -n "$SCHEME" ]; then
              xcodebuild -project "$PROJ_NAME" -scheme "$SCHEME" -configuration Release "${BUILD_FLAGS[@]}" build || \
              xcodebuild -project "$PROJ_NAME" -scheme "$SCHEME" -configuration Debug "${BUILD_FLAGS[@]}" build || \
              xcodebuild -project "$PROJ_NAME" -target "$TARGET" -configuration Release "${BUILD_FLAGS[@]}" build
            else
              xcodebuild -project "$PROJ_NAME" -target "$TARGET" -configuration Release "${BUILD_FLAGS[@]}" build || \
              xcodebuild -project "$PROJ_NAME" -target "$TARGET" -configuration Debug "${BUILD_FLAGS[@]}" build
            fi
            popd
          fi

          echo "=== Step 4: Locating Compiled .app Bundle & Signing with Certificate 2 ==="
          APP_PATH=$(find "$DERIVED_DATA" -name "*.app" -path "*-iphoneos/*" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -not -path "*/Pods/*" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find compiled .app bundle!"
            exit 1
          fi

          APP_BASENAME=$(basename "$APP_PATH" .app)
          echo "Found compiled .app: $APP_PATH ($APP_BASENAME)"

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/$APP_BASENAME.app"
          TARGET_APP="$RUNNER_TEMP/Payload/$APP_BASENAME.app"

          if [ -f "$TARGET_APP/Info.plist" ] && [ -n "$FINAL_BUNDLE_ID" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $FINAL_BUNDLE_ID" "$TARGET_APP/Info.plist" || true
          fi

          if [ -s "$RUNNER_TEMP/certs/cert.mobileprovision" ]; then
            cp "$RUNNER_TEMP/certs/cert.mobileprovision" "$TARGET_APP/embedded.mobileprovision"
            echo "Embedded cert.mobileprovision into $APP_BASENAME.app"
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" 2>/dev/null | head -n 1 | grep -o '"[^"]*"' | tr -d '"' || echo "")

          if [ -n "$CERT_IDENTITY" ]; then
            echo "Signing with P12 Certificate Identity: $CERT_IDENTITY"
            if [ -d "$TARGET_APP/Frameworks" ]; then
              find "$TARGET_APP/Frameworks" \( -name "*.framework" -o -name "*.dylib" \) | while read -r FW; do
                /usr/bin/codesign --force --sign "$CERT_IDENTITY" --timestamp=none "$FW" || /usr/bin/codesign --force --sign - --timestamp=none "$FW" || true
              done
            fi
            if [ -s "$RUNNER_TEMP/certs/entitlements.plist" ]; then
              /usr/bin/codesign --force --sign "$CERT_IDENTITY" --entitlements "$RUNNER_TEMP/certs/entitlements.plist" --timestamp=none "$TARGET_APP" || \
              /usr/bin/codesign --force --deep --sign - --timestamp=none "$TARGET_APP"
            else
              /usr/bin/codesign --force --sign "$CERT_IDENTITY" --timestamp=none "$TARGET_APP" || \
              /usr/bin/codesign --force --deep --sign - --timestamp=none "$TARGET_APP"
            fi
          else
            echo "Applying Ad-Hoc Code Signature with Embedded MobileProvision..."
            /usr/bin/codesign --force --deep --sign - --timestamp=none "$TARGET_APP" || true
          fi

          pushd "$RUNNER_TEMP"
          IPA_FILENAME="${APP_BASENAME}-signed.ipa"
          zip -r -q "$GITHUB_WORKSPACE/output/$IPA_FILENAME" Payload
          popd

          ls -lh "$GITHUB_WORKSPACE/output/"
          echo "IPA_FILE=$IPA_FILENAME" >> "$GITHUB_ENV"

      - name: Upload Signed IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-ipa-package
          path: output/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish Signed IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Signed IPA Build #${{ github.run_number }} (${{ env.IPA_FILE }})"
          body: |
            ### Build IPA Thành Công (Tự Động Ký Chứng Chỉ & Fix Lỗi bởi AI)
            - **File IPA:** `${{ env.IPA_FILE }}`
            - **Bundle ID đã đồng bộ:** `${{ env.TARGET_BUNDLE_ID }}`
            - **Mật khẩu chứng chỉ P12:** `1`
            - **Commit:** `${{ github.sha }}`
          files: output/*.ipa
          draft: false
          prerelease: false
